name: CMake on Linux (ROCM x86_64)

on:
  #push:
  #  branches: [ $default-branch ]
  pull_request:
    branches: ["LTS-C*"]

jobs:
  build:
    runs-on: [self-hosted, linux, x64, rocm]

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      # Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
            - rocm_version: "10.1"

    steps:
      - uses: actions/checkout@v6
      - name: Set reusable strings and path
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        run: |
          echo "build-output-dir=${{github.workspace}}/build" >> "$GITHUB_OUTPUT"
          echo "PATH=$HOME/cmake-4.4.4-linux-x86_64/bin/:$PATH" >> "$GITHUB_ENV"
          echo "ROCM_PATH=/opt/rocm/core-${{matrix.rocm_version}}" >> "$GITHUB_ENV"
          echo "HIP_PATH=/opt/rocm/core-${{matrix.rocm_version}}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rocm/core-${{matrix.rocm_version}}/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      # Strict C++17: no compiler extensions, except the anonymous structs in the unions of array.h
      - name: Configure CMake
        run: |
          STRICT_FLAGS="-Werror=c++20-extensions -pedantic-errors -Wno-gnu-anonymous-struct"
          cmake -G "Ninja" -DENABLE_HIP=ON -DENABLE_CUDA=OFF -DENABLE_CPU=OFF -DENABLE_BENCHMARK=ON \
          -DCMAKE_CXX_COMPILER="$HIP_PATH/bin/amdclang++" -DCMAKE_HIP_COMPILER="$HIP_PATH/bin/amdclang++"  \
          -DCMAKE_CXX_FLAGS="$STRICT_FLAGS" -DCMAKE_HIP_FLAGS="$STRICT_FLAGS" \
          -B ${{steps.strings.outputs.build-output-dir}} -DCMAKE_BUILD_TYPE="Release" -S ${{github.workspace}}

      - name: Build
        run: |
          cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      # The benchmarks are built (ENABLE_BENCHMARK=ON) so that CI checks that they compile, but ctest does not run them
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: |
          ctest --build-config Release --output-junit test_results.xml -E "^benchmark_"
