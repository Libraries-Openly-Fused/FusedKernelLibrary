name: CMake on Linux (CUDA x86_64)

on:
  #push:
  #  branches: [ $default-branch ]
  pull_request:
    branches: ["LTS-C*"]

jobs:
  build:
    runs-on: [self-hosted, linux, x64, cuda, ubuntu2404]

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      # Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix: #host,cuda,cuda_toolkit
        include:
          - host_compiler: "g++-13"
            cuda_toolkit: "12.9"
          - host_compiler: "g++-13"
            cuda_toolkit: "13.4"


    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set reusable strings and path
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        run: |
          echo "build-output-dir=${{github.workspace}}/build" >> "$GITHUB_OUTPUT"        
          echo "PATH=$HOME/cmake-4.4.2-linux-x86_64/bin/:$PATH" >> "$GITHUB_ENV"
      - name: Configure CMake
        run: |
          cmake -G "Ninja"  -DENABLE_HIP=OFF  -DENABLE_CUDA=ON -DENABLE_CPU=OFF -DENABLE_CPU_MULTITHREAD=ON  -DENABLE_BENCHMARK=ON \
          -DCMAKE_CXX_COMPILER="${{matrix.host_compiler}}" -DCMAKE_CUDA_COMPILER="/usr/local/cuda-${{matrix.cuda_toolkit}}/bin/nvcc" \
          -B ${{steps.strings.outputs.build-output-dir}} -DCMAKE_BUILD_TYPE="Release" -S ${{github.workspace}}

      - name: Build        
        run: |
          cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: |
          ctest --build-config Release --output-junit test_results.xml -E "^benchmark_"
